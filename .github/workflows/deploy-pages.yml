name: "Site — publicar no GitHub Pages"

# Publica a landing page automaticamente a cada alteração na branch main.
# Pré-requisito (1 clique, uma única vez):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar pasta do site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/

      # enablement: liga o GitHub Pages sozinho, sem precisar mexer em Settings.
      # (Só funciona em repositório público ou em plano pago — no plano gratuito
      #  com repositório privado o Pages não existe.)
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
